# MFE E2E regression → ONE TestRail run.
#
# Every shape of execution this workflow supports lands in a single TestRail run,
# so the run's case count is the total across all modules that executed:
#
#   scope: suite    — the whole suite in one job
#   scope: modules  — one job per module, fanned out in parallel
#   scope: spec     — a single spec file (or --grep expression)
#
# How the single run survives the fan-out: each job runs on its own runner, so
# .testrail/current-run.json cannot travel between them. The `open-run` job
# creates the run up front and publishes its id; every test job receives it as
# TESTRAIL_RUN_ID and widens that same run with its own cases. `close-run`
# closes it once the fan-out finishes.
#
# Required repository secrets: TESTRAIL_HOST, TESTRAIL_USERNAME, TESTRAIL_API_KEY,
# TESTRAIL_PROJECT_ID, TESTRAIL_SUITE_ID, ENCORE_USERNAME, ENCORE_PASSWORD.

name: E2E — TestRail

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to run
        type: choice
        required: true
        default: suite
        options: [suite, modules, spec]
      modules:
        description: 'scope=modules: comma-separated module folders under tests/ (blank = all)'
        type: string
        required: false
        default: ''
      spec:
        description: 'scope=spec: a spec path under tests/, or a --grep expression'
        type: string
        required: false
        default: ''
      close_run:
        description: Close the TestRail run when the workflow finishes
        type: boolean
        required: false
        default: true

concurrency:
  # One session at a time — two overlapping workflow runs would open two TestRail runs.
  group: e2e-testrail-${{ github.ref }}
  cancel-in-progress: false

env:
  CI_ENV: e2e
  TESTRAIL_ENABLED: 'true'
  TESTRAIL_HOST: ${{ secrets.TESTRAIL_HOST }}
  TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
  TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
  TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
  TESTRAIL_SUITE_ID: ${{ secrets.TESTRAIL_SUITE_ID }}

jobs:
  open-run:
    name: Open TestRail run
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.open.outputs.run_id }}
      run_url: ${{ steps.open.outputs.run_url }}
      run_name: ${{ steps.open.outputs.run_name }}
      matrix: ${{ steps.matrix.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Creates (or reuses) the run and writes run_id / run_url / run_name to $GITHUB_OUTPUT.
      - id: open
        run: npm run testrail:run:open

      - name: Summarise
        run: |
          echo "### TestRail run" >> "$GITHUB_STEP_SUMMARY"
          echo "[${{ steps.open.outputs.run_name }}](${{ steps.open.outputs.run_url }})" >> "$GITHUB_STEP_SUMMARY"

      # scope=modules fans out over this list; the other scopes use a single placeholder job.
      - id: matrix
        env:
          SCOPE: ${{ inputs.scope }}
          MODULES: ${{ inputs.modules }}
        run: |
          if [ "$SCOPE" != "modules" ]; then
            echo 'modules=["__single__"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$MODULES" ]; then
            list=$(printf '%s' "$MODULES" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$')
          else
            list=$(find tests -mindepth 1 -maxdepth 1 -type d -not -name crawler -printf '%f\n' | sort)
          fi
          json=$(printf '%s' "$list" | jq -R . | jq -s -c .)
          echo "modules=$json" >> "$GITHUB_OUTPUT"
          echo "Running modules: $json"

  test:
    name: ${{ inputs.scope == 'modules' && matrix.module || inputs.scope }}
    needs: open-run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialised on purpose: the suite is fullyParallel:false and the modules
      # share application state on cloudapps-e2e. Raise only if that changes.
      max-parallel: 1
      matrix:
        module: ${{ fromJson(needs.open-run.outputs.matrix) }}
    env:
      # THE single run. Every job pushes into it instead of opening its own.
      TESTRAIL_RUN_ID: ${{ needs.open-run.outputs.run_id }}
      BASE_URL: https://cloudapps-e2e.encoreglobal.com/navigator/
      ENCORE_USERNAME: ${{ secrets.ENCORE_USERNAME }}
      ENCORE_PASSWORD: ${{ secrets.ENCORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          SCOPE: ${{ inputs.scope }}
          MODULE: ${{ matrix.module }}
          SPEC: ${{ inputs.spec }}
        run: |
          case "$SCOPE" in
            suite)
              npx playwright test
              ;;
            modules)
              npx playwright test "tests/$MODULE"
              ;;
            spec)
              if [ -z "$SPEC" ]; then
                echo "::error::scope=spec requires the 'spec' input"; exit 1
              fi
              if [ -e "$SPEC" ]; then npx playwright test "$SPEC"; else npx playwright test --grep "$SPEC"; fi
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ inputs.scope == 'modules' && matrix.module || inputs.scope }}
          path: |
            reports/html-report
            reports/junit-results.xml
            reports/test-results.json
          retention-days: 14

  close-run:
    name: Close TestRail run
    needs: [open-run, test]
    if: always() && inputs.close_run
    runs-on: ubuntu-latest
    env:
      TESTRAIL_RUN_ID: ${{ needs.open-run.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run testrail:run:close
      - run: |
          echo "### TestRail run closed" >> "$GITHUB_STEP_SUMMARY"
          echo "[${{ needs.open-run.outputs.run_name }}](${{ needs.open-run.outputs.run_url }})" >> "$GITHUB_STEP_SUMMARY"
